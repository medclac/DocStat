name: Build DocStat Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Package folders into www/ on the fly
      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www/Subjects
          mkdir -p www/InfoHTMLs
          
          # Copy main HTML
          cp app.html www/index.html 2>/dev/null || cp index.html www/index.html
          
          # Copy subfolders
          cp Subjects/*.js www/Subjects/ 2>/dev/null || true
          cp InfoHTMLs/*.html www/InfoHTMLs/ 2>/dev/null || true
          
          # Copy root assets
          cp *.png www/ 2>/dev/null || true
          cp *.jpg www/ 2>/dev/null || true
          cp *.svg www/ 2>/dev/null || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # Inject required Android permissions and cleartext traffic into AndroidManifest.xml
      - name: Configure AndroidManifest Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Add permissions if not already present
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' "$MANIFEST"

            # Allow cleartext traffic for webhooks
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      # Generate Android App Launcher Icons safely
      - name: Generate App Icons
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/icon-only.png 2>/dev/null || cp icon.png assets/icon-foreground.png 2>/dev/null || true
            npx @capacitor/assets generate --android --assetPath assets || true
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Update App Name in strings.xml
        run: |
          STRINGS_PATH="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_PATH" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">DocStat<\/string>/g' "$STRINGS_PATH"
          fi

      # Restore keystore from GitHub Secret
      - name: Restore Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release.jks"
          ls -lh "$GITHUB_WORKSPACE/android/app/release.jks"

      # Auto-increment versionCode
      - name: Auto-Increment Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle || true

      # Sign and build release APK
      - name: Sign and Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD" \
            --no-daemon

      # Locate and rename APK
      - name: Rename APK
        run: |
          mkdir -p final-apk
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" final-apk/DocStat-v${{ github.run_number }}.apk
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocStat-v${{ github.run_number }}-APK
          path: final-apk/*.apk
          if-no-files-found: error
