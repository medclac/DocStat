name: Generate Keystore
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore release.jks \
            -alias docstat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "docstat123" \
            -keypass "docstat123" \
            -dname "CN=DocStat, OU=Medical, O=DocStat, L=City, ST=State, C=IN"
      - name: Print Base64 to Copy
        run: |
          echo "==================== COPY BELOW THIS LINE ===================="
          base64 release.jks | tr -d '\n'
          echo ""
          echo ""
          echo "==================== COPY ABOVE THIS LINE ===================="
          
